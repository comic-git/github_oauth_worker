name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]' -r infra/requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m unittest discover -s infra/tests -p 'test_*.py'

  preview-test:
    if: >-
      vars.PULUMI_CI_READY == 'true' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: test
    runs-on: ubuntu-latest
    environment: test-preview
    concurrency:
      group: pulumi-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: 3.264.0
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi preview --stack test --diff --non-interactive
        working-directory: infra

  preview-production:
    if: vars.PULUMI_CI_READY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment: production-preview
    concurrency:
      group: pulumi-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: 3.264.0
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi preview --stack production --diff --non-interactive
        working-directory: infra

  apply-test:
    if: vars.PULUMI_CI_READY == 'true' && github.event_name == 'push'
    needs: preview-test
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: pulumi-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check branch is still current
        run: |
          current_sha=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test -n "$current_sha" && test "$current_sha" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: 3.264.0
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi preview --stack test --diff --non-interactive
          pulumi up --stack test --yes --non-interactive
        working-directory: infra

  apply-production:
    if: vars.PULUMI_CI_READY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [preview-production, apply-test]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pulumi-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check master is still current
        run: |
          current_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test -n "$current_sha" && test "$current_sha" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: 3.264.0
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi preview --stack production --diff --non-interactive
          pulumi up --stack production --yes --non-interactive
        working-directory: infra
